name: Import Combination specification

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import:
    if: ${{ !contains(github.event.head_commit.message, '[imported-from-combination]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout new repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import specification repository
        run: |
          set -e
          rm -rf /tmp/combination-source
          git clone --depth 1 https://github.com/Neel2667/combination.git /tmp/combination-source
          rsync -a --delete --exclude='.git' /tmp/combination-source/ ./
          rm -f .github/workflows/import-combination.yml

      - name: Commit imported project
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import project specification from combination [imported-from-combination]"
          git push origin HEAD:main
